name: Refresh profile

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render neofetch card
        run: node scripts/neofetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git diff --quiet assets/neofetch.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile card" assets/neofetch.svg
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Site palette: lime snake, violet → lime cells.
          outputs: |
            dist/snake.svg?color_snake=#65a30d&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#4c1d95
            dist/snake-dark.svg?color_snake=#c6f432&color_dots=#161b22,#2e1065,#5b21b6,#a78bfa,#c6f432

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
